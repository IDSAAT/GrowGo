<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>GoGrow SignUp Page</title>
    <link rel="stylesheet" href="hairsignup.css">
  </head>
  <body>
    <div class="oji">
      <h1><img src="images/hlogo2.jpeg" alt="GoGrow logo" width="42px" height="30px">GrowGo<sub>Naturally Made To Fit Your Taste</sub>
    </div>
    <fieldset>
        <legend>Sign Up</legend>
        <div class="al1">
          <a href="#"><button id="" type="submit">Continue with Google <img src="images/googlelogo.jpeg" width="25px" height="20px"></button></a>
          <a href="#"><button id="" type="submit">Continue with Facebook <img src="images/FB.png" width="25px" height="20px"></button></a>
        </div>
        <h4>OR</h4>
          <form action="codeveri.html">
            <div class="firstname">
            <label>First Name: <input type="text" name="text_field" placeholder="First Name" maxlength="20" required></label>  
            </div> 
            <div class="middlename">
            <label>Middle Name(Optional): <input type="text" name="text_field" placeholder="Middle Name" maxlength="20"></label>  
            </div>
            <div class="lastname">
            <label>Last Name: <input type="text" name="text_field" placeholder="Last Name" maxlength="20" required></label>
            </div>   
            <div class="email">
            <label>E-Mail: <input type="email" name="email_field" placeholder="E-Mail here" autocomplete="on" required></label>
            </div>
            <div class="textarea">
            <label for="our_textarea">About Yourself:</label>
            <textarea name="textarea_area" cols="30" rows="10" placeholder="Talk About Yourself" required></textarea> 
            </div>
            <div class="password">
            <label>Password: <input type="password" name="password_field" required></label>
            </div>
            <div class="confirm-password">
            <label>Confirm Password: <input type="password" name="confirm-password_field" required></label>
            </div>
            <div class="terms">
            <label> <input type="checkbox" name="terms" required> I agree to the <a href="#">Terms and Conditions</a></label>
            </div>
            <div>
            <a href="codeveri.html"><button id="go">&rArr; Sign Up &lArr;</button></a>
            </div>
          </form>
    </fieldset>
  </body>
</html>
